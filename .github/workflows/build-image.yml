name: Build Glass Box image

# Same pattern as kennethfoo24/elastic-demo-eden build-o11y-extras.yml: build on GitHub, push to Docker Hub.
# Repo secrets required: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token with write scope).
# The image holds no secrets (.dockerignore excludes elasticsearch.txt, .env and backend/secrets);
# runtime credentials come from the Kubernetes Secret created by deploy/scripts/create_secrets.sh.

on:
  push:
    branches: [main, feat/glassbox-deploy]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Backend tests (unit only, no network)
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "pytest-timeout>=2"
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/glassbox:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/glassbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy reference
        run: |
          echo "Deploy with: IMAGE=docker.io/<dockerhub user>/glassbox@${{ steps.push.outputs.digest }} WITH_TRAFFICGEN=1 deploy/scripts/deploy.sh" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.push.outputs.digest }}"
