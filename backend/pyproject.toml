[project]
name = "glassbox-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "httpx>=0.27",
  "elasticsearch>=9.0,<10",
  "google-genai>=2.28",
  "openai>=3",
  "langchain>=1.4,<2",  # required by opentelemetry-instrumentation-genai-langchain (it skips itself when `langchain` is absent)
  "langchain-core>=1.6",
  "langchain-openai>=1.6",
  "langchain-google-genai>=4.4",
  "elastic-opentelemetry>=1.16",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-google-genai",
  "opentelemetry-instrumentation-genai-openai",
  "opentelemetry-instrumentation-genai-langchain",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
include = ["app*", "trafficgen*"]
